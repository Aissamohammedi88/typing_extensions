name: Third Party Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0'  # Weekly

permissions:
  contents: read

jobs:
  skip-schedule-on-fork:
    runs-on: ubuntu-latest
    if: >-
      github.repository == 'python/typing_extensions'
      || github.event_name != 'schedule'
    steps:
      - run: "true"

  pydantic:
    name: pydantic tests
    needs: skip-schedule-on-fork
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.0"
          checksum: "1468ebd5a5541121837c5a2817b9972ba6090fa6caa3d142620850a47fb75154"
          python-version: ${{ matrix.python-version }}
          
      - name: Checkout pydantic
        run: git clone --depth=1 https://github.com/pydantic/pydantic.git
        
      - name: Checkout typing_extensions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: typing-extensions-latest
          persist-credentials: false
          
      - name: Remove uv version requirement
        run: uv run --no-project --python '>=3.11' typing-extensions-latest/scripts/remove_uv_version_requirement.py pydantic
        
      - name: Run tests with typing_extensions main branch
        working-directory: pydantic
        run: |
          uv add --editable ../typing-extensions-latest
          uv sync --all-packages --group testing-extra --all-extras
          printf "\n\nINSTALLED DEPENDENCIES ARE:\n\n"
          uv pip list
          printf "\n\n"
          uv run pytest

  typing_inspect:
    name: typing_inspect tests
    needs: skip-schedule-on-fork
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
        with:
          version: "0.13.0"
          checksum: "1468ebd5a5541121837c5a2817b9972ba6090fa6caa3d142620850a47fb75154"
          python-version: ${{ matrix.python-version }}
          
      - name: Checkout typing_inspect
        run: git clone --depth=1 https://github.com/ilevkivskyi/typing_inspect.git
        
      - name: Checkout typing_extensions
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          path: typing-extensions-latest
          persist-credentials: false
          
      - name: Run tests
        working-directory: typing_inspect
        run: |
          uv add --editable ../typing-extensions-latest
          uv run pytest
