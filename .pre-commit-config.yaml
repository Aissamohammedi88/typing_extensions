# ═══════════════════════════════════════════════════════════════════════════════
# NEXUS OMEGA — PRE-COMMIT CONFIGURATION
# High-Density DevSecOps Pipeline
# ═══════════════════════════════════════════════════════════════════════════════
# - Formatage : Ruff (Ultra-rapide, remplace Black/Isort)
# - Typage    : Mypy (Strict, avec stubs)
# - Sécurité  : Gitleaks (Secrets) + Bandit (SAST)
# - CI/CD     : Actionlint + Zizmor (Sécurité des workflows)
# - Config    : Check-jsonschema (Renovate, YAML, TOML)
# ═══════════════════════════════════════════════════════════════════════════════

default_language_version:
  python: python3.12

default_stages: [pre-commit, pre-push]

repos:
  # ─────────────────────────────────────────────────────────────────────────────
  # 1. CORE : Formatage & Linting Python (Ultra-rapide)
  # ─────────────────────────────────────────────────────────────────────────────
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20 # renovate: datasource=github-tags depName=astral-sh/ruff-pre-commit
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ─────────────────────────────────────────────────────────────────────────────
  # 2. TYPAGE STRICT : Mypy avec stubs (Le marteau de la sécurité)
  # ─────────────────────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1 # renovate: datasource=github-tags depName=pre-commit/mirrors-mypy
    hooks:
      - id: mypy
        args: [--strict, --ignore-missing-imports]
        additional_dependencies:
          - types-requests
          - types-PyYAML
          - types-setuptools
        exclude: ^(tests/|docs/)

  # ─────────────────────────────────────────────────────────────────────────────
  # 3. SÉCURITÉ : Secrets & Vulnérabilités
  # ─────────────────────────────────────────────────────────────────────────────
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.3 # renovate: datasource=github-tags depName=gitleaks/gitleaks
    hooks:
      - id: gitleaks
        name: "🔒 Gitleaks (Détection de secrets)"

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.1 # renovate: datasource=github-tags depName=PyCQA/bandit
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^(tests/|docs/)

  # ─────────────────────────────────────────────────────────────────────────────
  # 4. CI/CD : Validation des GitHub Workflows
  # ─────────────────────────────────────────────────────────────────────────────
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12 # renovate: datasource=github-tags depName=rhysd/actionlint
    hooks:
      - id: actionlint
        additional_dependencies:
          - "github.com/wasilibs/go-shellcheck/cmd/shellcheck@v0.11.1"

  - repo: https://github.com/woodruffw/zizmor-pre-commit
    rev: v1.30.1 # renovate: datasource=github-tags depName=woodruffw/zizmor-pre-commit
    hooks:
      - id: zizmor
        name: "🛡️ Zizmor (Sécurité GitHub Actions)"

  # ─────────────────────────────────────────────────────────────────────────────
  # 5. CONFIG : Validation des schémas (Renovate, Pyproject, YAML)
  # ─────────────────────────────────────────────────────────────────────────────
  - repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.2 # renovate: datasource=github-tags depName=python-jsonschema/check-jsonschema
    hooks:
      - id: check-renovate
        additional_dependencies: ["json5==0.15.0"]
      - id: check-github-workflows
      - id: check-yaml
      - id: check-toml

  - repo: https://github.com/abravalheri/validate-pyproject
    rev: v0.26 # renovate: datasource=github-tags depName=abravalheri/validate-pyproject
    hooks:
      - id: validate-pyproject
        additional_dependencies: ["validate-pyproject-schema-store[all]==2026.8.15"]

  # ─────────────────────────────────────────────────────────────────────────────
  # 6. HYGIÈNE GÉNÉRALE : Fichiers & Formats
  # ─────────────────────────────────────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0 # renovate: datasource=github-tags depName=pre-commit/pre-commit-hooks
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-docstring-first
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: forbid-submodules
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-added-large-files
        args: [--maxkb=5000]

  # ─────────────────────────────────────────────────────────────────────────────
  # 7. META : Vérification de la configuration pre-commit elle-même
  # ─────────────────────────────────────────────────────────────────────────────
  - repo: meta
    hooks:
      - id: check-hooks-apply
      - id: check-useless-excludes

# ─────────────────────────────────────────────────────────────────────────────
# CI CONFIGURATION : Mise à jour automatique par pre-commit.ci
# ─────────────────────────────────────────────────────────────────────────────
ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto fixes from pre-commit.com hooks

    for more information, see https://pre-commit.ci
  autoupdate_schedule: weekly
  skip: []
  submodules: false
